
name: Build VANN ISLAND APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q VANN_ISLAND_v3_starter.zip -d /tmp/vann
          cp -R /tmp/vann/vann_project/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          old = '''        versionName = "3.0"
      }
          }'''

          new = '''        versionName = "3.0"
      }

      compileOptions {
          sourceCompatibility = JavaVersion.VERSION_17
          targetCompatibility = JavaVersion.VERSION_17
      }

      kotlinOptions {
          jvmTarget = "17"
      }
          }'''

          if old not in s:
              raise SystemExit("Bagian konfigurasi tidak ditemukan")
          p.write_text(s.replace(old, new, 1))
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VANN-ISLAND-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
