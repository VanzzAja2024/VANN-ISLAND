name: Build VANN ISLAND v4 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract VANN ISLAND v4
        run: |
          unzip -q VANN_ISLAND_v4_starter.zip -d /tmp/vann
          cp -R /tmp/vann/vann_project/. .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Configure Android and Kotlin
        run: |
          cat > app/build.gradle.kts <<'GRADLE'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.vann.island"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.vann.island"
                  minSdk = 26
                  targetSdk = 32
                  versionCode = 4
                  versionName = "4.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          GRADLE

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VANN-ISLAND-v4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
